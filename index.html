<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Auxiliar Inventario 🎮</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<style>
:root {
  --bg: #0a0e1a; --surf: #141928; --surf2: #1e2540; --border: #2d3561;
  --text: #e8ecf5; --muted: #8892b0;
  --A: #60a5fa; --B: #fb923c; --gold: #fbbf24; --green: #4ade80; --red: #f87171; --purple: #c084fc;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
.screen{display:none;flex-direction:column;min-height:100vh;}
.screen.active{display:flex;}
button{font-family:inherit;}

/* ── LOADING ── */
#screen-loading{align-items:center;justify-content:center;gap:16px;}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--A);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── REGISTER ── */
#screen-register{align-items:center;justify-content:center;padding:24px;}
.reg-card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;}
.reg-title{text-align:center;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--A),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.reg-subtitle{text-align:center;color:var(--muted);font-size:13px;margin-top:-8px;}
label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
input,select{width:100%;padding:12px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;outline:none;}
input:focus{border-color:var(--A);}
.btn{padding:12px 20px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--A),var(--purple));color:#fff;}
.btn-primary:hover{opacity:.9;}
.gm-link{text-align:center;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;}
#reg-error{display:none;background:rgba(248,113,113,.15);border:1px solid var(--red);color:var(--red);border-radius:8px;padding:8px 12px;font-size:13px;text-align:center;}

/* ── STUDENT ── */
#screen-student{background:var(--bg);}
.st-topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
.num-badge{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 12px rgba(0,0,0,.4);}
.st-info{flex:1;min-width:0;}
.st-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-team{font-size:11px;font-weight:600;}
.st-score{text-align:right;}
.st-score .pts{font-size:18px;font-weight:800;color:var(--gold);}
.st-score .lbl{font-size:10px;color:var(--muted);}
.st-body{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin:0 auto;}
.slide-mirror{background:#000;border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;}
.slide-mirror img{width:100%;display:block;}
.slide-mirror .mirror-tag{position:absolute;top:6px;right:8px;background:rgba(0,0,0,.65);color:var(--muted);font-size:10px;padding:2px 8px;border-radius:10px;}
.content-card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:16px;}
.content-card h3{font-size:15px;margin-bottom:8px;color:var(--A);}
.content-card p{font-size:13px;line-height:1.6;}
.data-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
.data-table th{background:var(--surf2);padding:6px 8px;text-align:left;color:var(--muted);font-size:11px;}
.data-table td{padding:6px 8px;border-bottom:1px solid var(--border);}
.data-table .val{color:var(--gold);font-weight:700;}
.highlight-box{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.35);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;}
.highlight-box.gold{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4);}
.highlight-box.green{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);}
.wait-msg{color:var(--muted);font-size:14px;text-align:center;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.submitted-card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center;}
.big-check{font-size:48px;}
.score-reveal{font-size:34px;font-weight:800;color:var(--green);margin:6px 0;}
.score-reveal.negative{color:var(--red);}
.field-result{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;margin-bottom:6px;font-size:12px;flex-wrap:wrap;}
.field-result.correct{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);}
.field-result.half{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);}
.field-result.wrong{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);}
.bet-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.bet-btn{background:var(--surf2);border:2px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;text-align:center;color:var(--text);transition:.15s;}
.bet-btn.selected.normal{border-color:var(--green);background:rgba(74,222,128,.12);}
.bet-btn.selected.extreme{border-color:var(--red);background:rgba(248,113,113,.12);}
.bet-icon{font-size:22px;}
.bet-name{font-weight:800;font-size:14px;margin:2px 0;}
.bet-desc{font-size:10px;color:var(--muted);line-height:1.4;}
.bet-tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}
.bet-tag.normal{background:rgba(74,222,128,.18);color:var(--green);}
.bet-tag.extreme{background:rgba(248,113,113,.18);color:var(--red);}
.fields-grid{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.field-row{display:flex;flex-direction:column;gap:4px;}
.field-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;}
.field-input{padding:11px;font-size:16px;}
.submit-btn{margin-top:14px;width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--green),#22c55e);color:#052e16;font-size:15px;font-weight:800;cursor:pointer;}
.quiz-opt{display:flex;align-items:center;gap:10px;width:100%;background:var(--surf2);border:2px solid var(--border);border-radius:10px;padding:13px;margin-top:8px;cursor:pointer;color:var(--text);font-size:14px;text-align:left;transition:.15s;}
.quiz-opt:hover{border-color:var(--A);}
.quiz-opt.picked{border-color:var(--gold);background:rgba(251,191,36,.12);}
.quiz-opt.correct{border-color:var(--green);background:rgba(74,222,128,.15);}
.quiz-opt.wrong{border-color:var(--red);background:rgba(248,113,113,.12);}
.quiz-letter{width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}

/* ── GM / PROYECTOR ── */
#screen-gm{height:100vh;overflow:hidden;}
.gm-bar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;z-index:30;position:relative;}
.gm-bar .grow{flex:1;}
.gmb{background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.gmb:hover{border-color:var(--A);}
.gmb.warn{color:var(--red);}
.slide-count{font-size:13px;font-weight:700;color:var(--muted);min-width:64px;text-align:center;}
.menu-wrap{position:relative;}
.menu-pop{display:none;position:absolute;top:110%;left:0;background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:250px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5);}
.menu-pop.open{display:block;}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--text);padding:9px 10px;border-radius:7px;font-size:13px;cursor:pointer;text-align:left;}
.menu-item:hover{background:var(--surf2);}
.menu-item .sub{color:var(--muted);font-size:11px;margin-left:auto;}
.status-pill{display:none;align-items:center;gap:6px;background:rgba(74,222,128,.15);border:1px solid var(--green);color:var(--green);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.status-pill.visible{display:flex;}

.gm-stage{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-height:0;}
#slide-img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;}
.nav-zone{position:absolute;top:0;bottom:0;width:18%;cursor:pointer;display:flex;align-items:center;z-index:5;opacity:0;transition:opacity .2s;}
.nav-zone:hover{opacity:1;}
.nav-zone.left{left:0;justify-content:flex-start;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent);}
.nav-zone.right{right:0;justify-content:flex-end;background:linear-gradient(-90deg,rgba(0,0,0,.35),transparent);}
.nav-arrow{font-size:44px;color:#fff;padding:0 14px;text-shadow:0 2px 8px #000;}

/* ── RACE STRIP ── */
#race{display:flex;height:158px;flex-shrink:0;border-top:2px solid var(--border);background:var(--surf);}
.race-half{flex:1;display:flex;flex-direction:column;min-width:0;}
.race-half.A{border-right:1px solid var(--border);}
.race-head{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;font-size:13px;font-weight:800;flex-shrink:0;}
.race-half.A .race-head{color:var(--A);background:rgba(96,165,250,.08);}
.race-half.B .race-head{color:var(--B);background:rgba(251,146,60,.08);}
.race-total{font-size:15px;}
.race-lane{flex:1;position:relative;margin:2px 8px 4px 8px;}
.race-lane::before{content:'';position:absolute;left:0;right:0;top:0;border-top:1px dashed rgba(255,255,255,.12);}
.racer{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center;transition:bottom .9s cubic-bezier(.2,.8,.3,1.1), left .5s;z-index:2;width:44px;margin-left:-22px;}
.racer-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.25);}
.racer-name{font-size:9px;color:var(--muted);max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.racer-pts{font-size:9px;font-weight:700;color:var(--gold);}
.racer.answered .racer-dot{box-shadow:0 0 0 3px var(--green),0 2px 8px rgba(0,0,0,.5);}

/* ── OVERLAYS ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(4,6,12,.88);z-index:100;align-items:center;justify-content:center;padding:20px;}
.overlay.active{display:flex;}
.ov-card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-height:92vh;overflow-y:auto;position:relative;}
.ov-close{position:absolute;top:10px;right:12px;background:var(--surf2);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;z-index:5;}
.ov-title{font-size:20px;font-weight:800;margin-bottom:12px;padding-right:40px;}

/* grid de slides */
#ov-grid .ov-card{max-width:1200px;}
.grid-slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.grid-thumb{border:2px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;position:relative;background:#000;transition:.15s;}
.grid-thumb:hover{border-color:var(--A);transform:scale(1.04);}
.grid-thumb.current{border-color:var(--gold);}
.grid-thumb img{width:100%;display:block;}
.grid-thumb .gnum{position:absolute;bottom:3px;right:5px;background:rgba(0,0,0,.7);font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;}

/* panel módulo GM */
#ov-module .ov-card{max-width:980px;}
.mod-status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surf2);border-radius:10px;padding:10px 14px;margin:12px 0;}
.mod-status .cnt{font-size:22px;font-weight:800;color:var(--green);}
.mod-status .who{display:flex;gap:5px;flex-wrap:wrap;flex:1;}
.who-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;opacity:.9;}
.mod-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.mod-actions .gmb{font-size:14px;padding:11px 18px;border-radius:9px;}
.gmb.go{background:linear-gradient(135deg,var(--green),#22c55e);color:#052e16;border:none;font-weight:800;}
.gmb.stop{background:rgba(248,113,113,.18);border-color:var(--red);color:var(--red);font-weight:800;}
.gmb.reveal{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#451a03;border:none;font-weight:800;}
.reveal-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
.reveal-table th{background:var(--surf2);padding:7px 9px;text-align:left;color:var(--muted);font-size:11px;}
.reveal-table td{padding:6px 9px;border-bottom:1px solid var(--border);}
.quiz-bar{background:var(--surf2);border-radius:6px;height:22px;overflow:hidden;margin-top:4px;position:relative;}
.quiz-bar > div{height:100%;transition:width .5s;}
.quiz-bar span{position:absolute;left:8px;top:2px;font-size:12px;font-weight:700;}

/* consulta */
#ov-chart .ov-card{max-width:1000px;}
.chart-container{position:relative;height:380px;background:var(--surf2);border-radius:10px;padding:10px;margin-top:10px;}
.slider-row{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap;}
.slider-row input[type=range]{flex:1;min-width:180px;accent-color:var(--A);}
.slider-val{font-size:18px;font-weight:800;color:var(--gold);min-width:70px;}
.slider-sub{font-size:13px;color:var(--muted);}

/* leaderboard */
#ov-board .ov-card{max-width:760px;}
.lb-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;margin-bottom:6px;background:var(--surf2);}
.lb-rank{font-size:16px;font-weight:800;width:34px;text-align:center;}
.lb-name{flex:1;font-weight:700;font-size:15px;}
.lb-team{font-size:11px;font-weight:700;}
.lb-pts{font-weight:800;color:var(--gold);font-size:16px;}
.lb-teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.lb-teamcard{border-radius:12px;padding:14px;text-align:center;border:2px solid;}
.lb-teamcard .t-pts{font-size:28px;font-weight:800;}

@media (max-width:700px){
  #race{height:120px;}
  .racer-dot{width:26px;height:26px;font-size:12px;}
  .gm-bar{flex-wrap:wrap;}
}
</style>
</head>
<body>

<!-- SCREEN: LOADING -->
<div class="screen active" id="screen-loading">
  <div class="spinner"></div>
  <p style="color:var(--muted);">Conectando...</p>
</div>

<!-- SCREEN: REGISTER -->
<div class="screen" id="screen-register">
  <div class="reg-card">
    <div class="reg-title">📦 Auxiliar Inventario</div>
    <div class="reg-subtitle">Identifícate para recibir tu número y tu equipo</div>
    <div>
      <label>Tu nombre</label>
      <input id="reg-name" type="text" placeholder="Nombre y apellido" maxlength="30" autocomplete="off">
    </div>
    <div id="reg-error"></div>
    <button class="btn btn-primary" onclick="doRegister()">Entrar 🚀</button>
    <div class="gm-link" onclick="showGMLogin()">Soy el profesor</div>
    <div id="gm-login-area" style="display:none;gap:10px;">
      <input id="gm-pw" type="password" placeholder="Contraseña del profesor">
      <button class="btn btn-primary" onclick="doGMLogin()">Entrar como GameMaster 🎓</button>
    </div>
  </div>
</div>

<!-- SCREEN: STUDENT -->
<div class="screen" id="screen-student">
  <div class="st-topbar">
    <div class="num-badge" id="st-num">?</div>
    <div class="st-info">
      <div class="st-name" id="st-name">—</div>
      <div class="st-team" id="st-team">—</div>
    </div>
    <div class="st-score">
      <div class="pts" id="st-score">0</div>
      <div class="lbl">puntos</div>
    </div>
  </div>
  <div class="st-body">
    <div class="slide-mirror">
      <img id="st-slide" src="" alt="Slide actual">
      <div class="mirror-tag" id="st-slide-tag">Slide 1</div>
    </div>
    <div id="st-module-area">
      <div class="wait-msg" style="padding:14px 0;">Sigue la presentación — aquí aparecerán los ejercicios 👀</div>
    </div>
  </div>
</div>

<!-- SCREEN: GM -->
<div class="screen" id="screen-gm">
  <div class="gm-bar">
    <button class="gmb" onclick="navSlide(-1)">◀</button>
    <span class="slide-count" id="slide-count">1 / 80</span>
    <button class="gmb" onclick="navSlide(1)">▶</button>
    <button class="gmb" onclick="openGrid()" title="Ver todos los slides (G)">⊞</button>
    <button class="gmb" onclick="toggleFullscreen()" title="Pantalla completa (F)">⛶</button>
    <div class="menu-wrap">
      <button class="gmb" onclick="toggleMenu('menu-ex')">✏️ Ejercicios ▾</button>
      <div class="menu-pop" id="menu-ex"></div>
    </div>
    <div class="menu-wrap">
      <button class="gmb" onclick="toggleMenu('menu-quiz')">❓ Preguntas ▾</button>
      <div class="menu-pop" id="menu-quiz"></div>
    </div>
    <div class="menu-wrap">
      <button class="gmb" onclick="toggleMenu('menu-chart')">📊 Consulta ▾</button>
      <div class="menu-pop" id="menu-chart"></div>
    </div>
    <div class="status-pill" id="status-pill" onclick="openModulePanel()"></div>
    <div class="grow"></div>
    <span style="font-size:12px;color:var(--muted);" id="gm-count-lbl">👥 0</span>
    <button class="gmb" onclick="showLeaderboard()">🏆</button>
    <button class="gmb warn" onclick="resetGame()">↺</button>
  </div>
  <div class="gm-stage">
    <img id="slide-img" src="" alt="Slide">
    <div class="nav-zone left" onclick="navSlide(-1)"><span class="nav-arrow">‹</span></div>
    <div class="nav-zone right" onclick="navSlide(1)"><span class="nav-arrow">›</span></div>
  </div>
  <div id="race">
    <div class="race-half A">
      <div class="race-head"><span id="race-name-A">🔵 Equipo Azul</span><span class="race-total" id="race-total-A">0</span></div>
      <div class="race-lane" id="race-lane-A"></div>
    </div>
    <div class="race-half B">
      <div class="race-head"><span id="race-name-B">🟠 Equipo Naranja</span><span class="race-total" id="race-total-B">0</span></div>
      <div class="race-lane" id="race-lane-B"></div>
    </div>
  </div>
</div>

<!-- OVERLAY: GRID DE SLIDES -->
<div class="overlay" id="ov-grid">
  <div class="ov-card">
    <button class="ov-close" onclick="closeOverlay('ov-grid')">✕</button>
    <div class="ov-title">Ir a slide…</div>
    <div class="grid-slides" id="grid-slides"></div>
  </div>
</div>

<!-- OVERLAY: MÓDULO ACTIVO (GM) -->
<div class="overlay" id="ov-module">
  <div class="ov-card">
    <button class="ov-close" onclick="closeOverlay('ov-module')">✕</button>
    <div id="module-panel-body"></div>
  </div>
</div>

<!-- OVERLAY: CONSULTA (charts) -->
<div class="overlay" id="ov-chart">
  <div class="ov-card">
    <button class="ov-close" onclick="closeChartOverlay()">✕</button>
    <div id="chart-body"></div>
  </div>
</div>

<!-- OVERLAY: LEADERBOARD -->
<div class="overlay" id="ov-board">
  <div class="ov-card">
    <button class="ov-close" onclick="closeOverlay('ov-board')">✕</button>
    <div class="ov-title">🏆 Tabla de Posiciones</div>
    <div id="board-body"></div>
  </div>
</div>

    state.uid = cred.user.uid;

async function checkExistingSession() {
  const snap = await db.collection('students').doc(state.uid).get();
  if (snap.exists) {
    state.student = snap.data();
    if (state.student.isGM) { enterGM(); return; }
    subscribeAll();
    showScreen('screen-student');
    updateStudentTopbar();
  } else {
    showScreen('screen-register');
  }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  if (!name) { showRegError('Escribe tu nombre'); return; }
  try {
    const number = await db.runTransaction(async tx => {
      const ref = db.collection('meta').doc('counter');
      const snap = await tx.get(ref);
      const n = (snap.exists ? (snap.data().n||0) : 0) + 1;
      tx.set(ref, { n });
      return n;
    });
    const teamId = number % 2 === 1 ? 'A' : 'B';
    const student = { name, number, teamId, score:0, isGM:false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp() };
    await db.collection('students').doc(state.uid).set(student);
    state.student = student;
    subscribeAll();
    showScreen('screen-student');
    updateStudentTopbar();
  } catch(e) { showRegError('Error al registrar: '+e.message); }
}

// ════════════════════════════════════════════════════
// 🔗 SUBSCRIPTIONS
// ════════════════════════════════════════════════════
function subscribeAll() {
  const u1 = db.collection('meta').doc('session').onSnapshot(snap => {
    if (!snap.exists) return;
    const prev = state.session;
    state.session = snap.data();
    const s = state.session;
    if (state.isGM) { renderGMSession(prev); return; }
    // Alumno: detectar reset
    if (prev && s.resetAt && prev.resetAt !== s.resetAt) {
      state.unsubs.forEach(u=>u()); state.unsubs=[];
      state.student=null;
      showScreen('screen-register');
      return;
    }
    renderStudentSlide();
    const modChanged = JSON.stringify(prev?.module) !== JSON.stringify(s.module);
    const revChanged = prev?.revealed !== s.revealed;
    if (modChanged || revChanged || !prev) renderStudentModule();
  });
  const u2 = db.collection('students').onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type==='removed') delete state.allStudents[ch.doc.id];
      else state.allStudents[ch.doc.id] = {id:ch.doc.id,...ch.doc.data()};
    });
    if (state.isGM) { renderRace(); updateGMCount(); }
    if (state.allStudents[state.uid]) {
      state.student = state.allStudents[state.uid];
      if (!state.isGM) updateStudentTopbar();
    }
  });
  state.unsubs.push(u1, u2);
}

function subscribeAnswers(moduleId) {
  state.unsubs.filter(u=>u._isAnswerSub).forEach(u=>u());
  state.unsubs = state.unsubs.filter(u=>!u._isAnswerSub);
  state.allAnswers = {};
  if (!moduleId) { if (state.isGM) renderRace(); return; }
  const u = db.collection('answers').where('moduleId','==',moduleId).onSnapshot(snap => {
    const prevMy = state.allAnswers?.[state.uid];
    state.allAnswers = {};
    snap.forEach(d => state.allAnswers[d.data().uid] = {id:d.id,...d.data()});
    if (state.isGM) { renderModulePanel(); renderRace(); return; }
    const nextMy = state.allAnswers[state.uid];
    if (JSON.stringify(prevMy) !== JSON.stringify(nextMy)) renderStudentModule();
  });
  u._isAnswerSub = true;
  state.unsubs.push(u);
}

let stModKey = '__init__';
function renderStudentModule() {
  const area = document.getElementById('st-module-area');
  const sess = state.session;
  const mod = sess?.module;
  const key = moduleKey(mod);
  // suscribirse SOLO cuando cambia el módulo/pregunta (no en cada render,
  // si no el formulario se borra con cada respuesta de otro alumno)
  if (key !== stModKey) {
    stModKey = key;
    subscribeAnswers(currentAnswerModuleId(mod));
  }
  if (!mod || (!mod.isOpen && !sess.revealed)) {
    area.innerHTML = `<div class="wait-msg" style="padding:14px 0;">Sigue la presentación — aquí aparecerán los ejercicios 👀</div>`;
    return;
  }
  const myAnswer = state.allAnswers[state.uid];
  if (mod.kind === 'exercise') area.innerHTML = buildStudentExercise(mod, myAnswer);
  else if (mod.kind === 'round') area.innerHTML = buildStudentRoundQ(mod, myAnswer);
}

      <div class="wait-msg" style="margin-top:12px;">Esperando que el profesor revele los resultados...</div>
    </div>`;
  return `
    ${getExerciseProblem(mod.id)}
    <div class="content-card" style="margin-top:12px;">
      <h3>💰 Elige tu apuesta</h3>
      <div class="bet-selector">

        </button>
        <button type="button" class="bet-btn" id="bet-extreme" onclick="selectBet('extreme')">
          <div class="bet-icon">🚀</div><div class="bet-name">Extremo</div>
          <div class="bet-desc">Ganas 1.5× puntos<br>Pierdes 1.5× si fallas todo</div>
        </button>
      </div>
      <h3 style="margin-top:14px;">📝 Tus respuestas</h3>
      <div class="fields-grid">
        ${ex.fields.map(f=>`
          <div class="field-row">
            <label class="field-label">${f.label}</label>
            <input class="field-input" type="text" inputmode="decimal" id="field-${f.key}" placeholder="ej: 857.6" autocomplete="off">
          </div>`).join('')}
      </div>
      <button class="submit-btn" onclick="submitExercise('${mod.id}')">Enviar Respuesta ✓</button>
    </div>`;

function selectBet(type) {
  selectedBet = type;
  const bn = document.getElementById('bet-normal');
  const be = document.getElementById('bet-extreme');
  if (bn) bn.className = 'bet-btn' + (type==='normal' ? ' selected normal' : '');
  if (be) be.className = 'bet-btn' + (type==='extreme' ? ' selected extreme' : '');
}

async function submitExercise(exId) {
  const ex = EXERCISES[exId];
  const values = {};
  let allFilled = true;
  ex.fields.forEach(f => {
    const el = document.getElementById('field-'+f.key);
    const v = el ? el.value.trim().replace(',','.') : '';
    if (v === '') allFilled = false;
    values[f.key] = parseFloat(v);
  });
  if (!allFilled) { alert('Completa todos los campos antes de enviar'); return; }
  await db.collection('answers').doc(exId+'_'+state.uid).set({
    moduleId:exId, kind:'exercise', uid:state.uid, value:values, bet:selectedBet,
    submittedAt:firebase.firestore.FieldValue.serverTimestamp(), pointsAwarded:null
  });
}

function buildRevealedExercise(ex, myAnswer) {
  const ptsPer = ex.basePoints / ex.fields.length;
  const rows = ex.fields.map(f => {
    const sv = parseFloat(myAnswer.value?.[f.key]);
    const diff = Math.abs(sv - f.correct);
    let cls='wrong', mark='✗';
    if (diff <= f.tol) { cls='correct'; mark='✓'; }
    else if (diff <= f.tol*2) { cls='half'; mark='~'; }
    return `<div class="field-result ${cls}">
      <span>${f.label}: <strong>${isNaN(sv)?'—':sv}</strong></span>
      <span>${mark} Correcto: ${f.correct}</span>
    </div>`;
  }).join('');
  const finalPts = myAnswer.pointsAwarded ?? 0;
  const positive = finalPts >= 0;
  return `
    <div class="submitted-card">
      <div style="font-size:42px;">${positive?'🎉':'😬'}</div>
      <div class="score-reveal ${positive?'':'negative'}">${positive?'+':''}${finalPts.toLocaleString()} pts</div>
      <div style="margin-bottom:14px;"><span class="bet-tag ${myAnswer.bet||'normal'}">${myAnswer.bet==='extreme'?'🚀 EXTREMO':'🎯 NORMAL'}</span></div>
      <div style="text-align:left;">${rows}</div>
    </div>`;
}

// ── Round de preguntas (alumno) — feedback inmediato + bonus rapidez ──
function buildStudentRoundQ(mod, myAnswer) {
  const round = QUIZ_ROUNDS[mod.id];
  const qIdx = mod.qIndex || 0;
  const qz = round.questions[qIdx];
  const letters = ['A','B','C','D'];
  const header = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <span style="font-weight:800;color:var(--purple);">❓ ${round.title}</span>
    <span style="font-size:12px;color:var(--muted);">Pregunta ${qIdx+1}/${round.questions.length}</span>
  </div>`;
  if (myAnswer) {
    // feedback inmediato: correcta destacada + puntos ganados
    const ok = myAnswer.option === qz.correct;
    const pts = myAnswer.pointsAwarded ?? 0;
    const bonus = myAnswer.speedBonus ?? 0;
    return `<div class="content-card">
      ${header}
      <h3 style="color:var(--text);">${qz.q}</h3>
      ${qz.options.map((o,i)=>{
        let cls = '';
        if (i === qz.correct) cls = 'correct';
        else if (i === myAnswer.option) cls = 'wrong';
        return `<div class="quiz-opt ${cls}"><span class="quiz-letter">${letters[i]}</span>${o}${i===qz.correct?' ✓':''}</div>`;
      }).join('')}
      <div style="text-align:center;margin-top:16px;">
        <div style="font-size:38px;">${ok?'🎉':'😬'}</div>
        <div class="score-reveal ${ok?'':'negative'}" style="font-size:26px;">${ok?'+'+pts.toLocaleString()+' pts':'0 pts'}</div>
        ${ok && bonus>0 ? `<div style="font-size:12px;color:var(--gold);font-weight:700;">⚡ incluye ${bonus} pts de bonus por rapidez</div>` : ''}
        <div class="wait-msg" style="margin-top:12px;">Espera la siguiente pregunta...</div>
      </div>
    </div>`;
  }
  return `<div class="content-card">
    ${header}
    <h3 style="color:var(--text);font-size:17px;">${qz.q}</h3>
    <p style="color:var(--gold);font-size:12px;font-weight:700;">+${QUIZ_BASE_PTS} pts si aciertas · ⚡ hasta +${QUIZ_SPEED_PTS} extra por rapidez</p>
    ${qz.options.map((o,i)=>`
      <button class="quiz-opt" onclick="submitRoundAnswer('${mod.id}',${qIdx},${i})">
        <span class="quiz-letter">${letters[i]}</span>${o}
      </button>`).join('')}
  </div>`;
}

async function submitRoundAnswer(roundId, qIdx, optionIdx) {
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  const mod = state.session?.module;
  if (!mod || mod.id !== roundId || (mod.qIndex||0) !== qIdx || !mod.isOpen) return;
  const qz = QUIZ_ROUNDS[roundId].questions[qIdx];
  const openedMs = mod.openedAt?.toMillis?.() || Date.now();
  const elapsedMs = Math.max(0, Date.now() - openedMs);
  const correct = optionIdx === qz.correct;
  const speedBonus = correct ? Math.round(QUIZ_SPEED_PTS * Math.max(0, 1 - elapsedMs/QUIZ_SPEED_WINDOW_MS)) : 0;
  const pointsAwarded = correct ? QUIZ_BASE_PTS + speedBonus : 0;
  const modId = `${roundId}_q${qIdx}`;
  const ref = db.collection('answers').doc(modId+'_'+state.uid);
  const existing = await ref.get();
  if (existing.exists) return; // no responder dos veces
  await ref.set({
    moduleId:modId, kind:'round', roundId, qIndex:qIdx, uid:state.uid,
    option:optionIdx, correct, elapsedMs, speedBonus, pointsAwarded,
    submittedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  if (pointsAwarded > 0) {
    await db.collection('students').doc(state.uid).update({
      score: firebase.firestore.FieldValue.increment(pointsAwarded)
    });
  }
}

// ── Revelar y puntuar (solo ejercicios Excel; los rounds puntúan al instante) ──
async function revealModule() {
  const mod = state.session?.module;
  if (!mod || mod.kind !== 'exercise') return;
  await db.collection('meta').doc('session').update({ 'module.isOpen': false });
  const ansSnap = await db.collection('answers').where('moduleId','==',mod.id).get();
  const batch = db.batch();
  ansSnap.forEach(d => {
    const ans = d.data();
    if (ans.pointsAwarded !== null && ans.pointsAwarded !== undefined) return; // ya puntuado
    const finalPts = calculateScore(EXERCISES[mod.id], ans).finalPts;
    batch.update(d.ref, { pointsAwarded: finalPts });
    batch.update(db.collection('students').doc(ans.uid), { score: firebase.firestore.FieldValue.increment(finalPts) });
  });
  await batch.commit();
  await db.collection('meta').doc('session').update({ revealed:true });
}

function calculateScore(ex, ans) {
  const ptsPer = ex.basePoints / ex.fields.length;
  let earned = 0;
  ex.fields.forEach(f => {
    const sv = parseFloat(ans.value?.[f.key]) || 0;
    const diff = Math.abs(sv - f.correct);
    if (diff <= f.tol) earned += ptsPer;
    else if (diff <= f.tol*2) earned += ptsPer*0.5;
  });
  let finalPts;
  if (ans.bet === 'extreme') {
    finalPts = earned > 0 ? Math.round(earned * 1.5) : -Math.round(ex.basePoints * 1.5);
  } else {
    finalPts = Math.round(earned);
  }
  return { earned, finalPts };
}

// 🏁 RACE STRIP — alumnos suben según puntaje
// ════════════════════════════════════════════════════
function renderRace() {
  const students = Object.values(state.allStudents).filter(s=>!s.isGM);
  const maxScore = Math.max(1000, ...students.map(s=>s.score||0));
  ['A','B'].forEach(teamId => {
    const lane = document.getElementById('race-lane-'+teamId);
    if (!lane) return;
    const members = students.filter(s=>s.teamId===teamId).sort((a,b)=>a.number-b.number);
    const total = members.reduce((acc,s)=>acc+(s.score||0),0);
    document.getElementById('race-total-'+teamId).textContent = total.toLocaleString() + ' pts';
    // reutilizar nodos existentes para que la transición CSS anime
    const seen = new Set();
    members.forEach((s,i) => {
      seen.add(s.id);
      let el = lane.querySelector(`[data-uid="${s.id}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'racer';
        el.dataset.uid = s.id;
        el.innerHTML = `<div class="racer-dot" style="background:${teamColor(teamId)}"></div>
          <div class="racer-name"></div><div class="racer-pts"></div>`;
        lane.appendChild(el);
      }
      el.querySelector('.racer-dot').textContent = s.number;
      el.querySelector('.racer-name').textContent = firstName(s.name);
      el.querySelector('.racer-pts').textContent = (s.score||0).toLocaleString();
      el.title = `#${s.number} ${s.name} — ${(s.score||0).toLocaleString()} pts`;
      const leftPct = members.length===1 ? 50 : 8 + (i/(members.length-1))*84;
      el.style.left = leftPct + '%';
      const frac = Math.max(0, Math.min(1, (s.score||0)/maxScore));
      el.style.bottom = `calc(${(frac*100).toFixed(1)}% - ${(frac*58).toFixed(0)}px)`; // 58px = alto del chip
      el.classList.toggle('answered', !!state.allAnswers[s.id] && !!state.session?.module?.isOpen);
    });
    lane.querySelectorAll('.racer').forEach(el => { if (!seen.has(el.dataset.uid)) el.remove(); });
  });
  updateStatusPill();
}

async function resetGame() {
  if (!confirm('¿Reiniciar la clase? Se borran alumnos, puntajes y respuestas.')) return;
  const stuSnap = await db.collection('students').get();
  const ansSnap = await db.collection('answers').get();
  const batch = db.batch();
  stuSnap.forEach(d => { if (!d.data().isGM) batch.delete(d.ref); });
  ansSnap.forEach(d => batch.delete(d.ref));
  batch.set(db.collection('meta').doc('counter'), { n: 0 });
  await batch.commit();
  await db.collection('meta').doc('session').set({ slide: state.session?.slide||1, module:null, revealed:false, resetAt: Date.now() });
  state.allAnswers = {};
  closeOverlay('ov-module');
}

document.addEventListener('keydown', e => {
  if (!state.isGM) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const anyOverlay = document.querySelector('.overlay.active');
  if (e.key === 'Escape' && anyOverlay) { anyOverlay.classList.remove('active'); if(anyOverlay.id==='ov-chart') destroyActiveChart(); return; }
  if (anyOverlay) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); navSlide(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); navSlide(-1); }
  if (e.key === 'Home') navSlide(-9999);
  if (e.key === 'End') navSlide(9999);
  if (e.key.toLowerCase() === 'g') openGrid();
  if (e.key.toLowerCase() === 'f') toggleFullscreen();
});

function destroyActiveChart() {
  if (state.activeChart) { try { state.activeChart.destroy(); } catch(e){} state.activeChart=null; }

function normalPDF(z) { return Math.exp(-0.5*z*z)/Math.sqrt(2*Math.PI); }
function normalCDF(z) {
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.7814779+t*(-1.8212560+t*1.3302744))));
  return z>=0 ? 1-p : p;
}

function initNormalChart(zVal) {
  zVal = zVal ?? 1.0;
  const canvas = document.getElementById('normal-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dataFull=[], dataFill=[];
  for (let z=-3.5; z<=3.5; z+=0.05) {
    const y = normalPDF(z);
    dataFull.push({x:Math.round(z*100)/100, y});
    dataFill.push({x:Math.round(z*100)/100, y: z<=zVal ? y : 0});
  }
  destroyActiveChart();
  state.activeChart = new Chart(ctx, {
    type:'line',
    data:{ datasets:[
      { label:'Distribución Normal', data:dataFull, borderColor:'rgba(96,165,250,0.9)', borderWidth:2.5, fill:false, pointRadius:0, tension:0.4 },
      { label:`Área (z≤${zVal.toFixed(2)})`, data:dataFill, backgroundColor:'rgba(74,222,128,0.3)', fill:true, pointRadius:0, borderWidth:0, tension:0.4 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, animation:{duration:200}, parsing:false,
      scales:{ x:{type:'linear',min:-3.5,max:3.5,title:{display:true,text:'z',color:'#8892b0'},ticks:{color:'#8892b0',maxTicksLimit:8},grid:{color:'rgba(255,255,255,0.05)'}},
               y:{display:false} },
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:d=>`P(Z≤${d.parsed.x.toFixed(2)}) = ${(normalCDF(d.parsed.x)*100).toFixed(1)}%`}} } }
  });
}

function updateZSlider(val) {
  const z = parseFloat(val);
  const pct = (normalCDF(z)*100).toFixed(1);
  const disp = document.getElementById('z-display');
  const pctDisp = document.getElementById('z-pct-display');
  if (disp) disp.textContent = z.toFixed(2);
  if (pctDisp) pctDisp.textContent = pct + '%';
  if (!state.activeChart) { initNormalChart(z); return; }
  if (state.activeChart.data.datasets.length > 1) {
    const fullData = state.activeChart.data.datasets[0].data;
    state.activeChart.data.datasets[1].data = fullData.map(p => ({ x: p.x, y: p.x <= z ? p.y : 0 }));
    state.activeChart.data.datasets[1].label = `Área (z≤${z.toFixed(2)}) = ${pct}%`;
    state.activeChart.update('none');
  }
}

function initCuCoChart() {
  const canvas = document.getElementById('cucoprofit-chart');
  if (!canvas) return;
  const mu=100, sigma=25, Cu=100, Co=20;
  const qVals=[], profits=[];
  for(let q=40; q<=175; q+=2) {
    let total=0;
    for(let s=0; s<1200; s++) {
      const u1=Math.random()||1e-9, u2=Math.random();
      const d = mu + sigma*Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
      total += Math.min(d,q)*Cu - Math.max(0,q-d)*Co;
    }
    qVals.push(q); profits.push(Math.round(total/1200));
  }
  const maxP = Math.max(...profits);
  const optQ = qVals[profits.indexOf(maxP)];
  destroyActiveChart();
  state.activeChart = new Chart(canvas, {
    type:'line',

function initPSimChart() {
  const canvas = document.getElementById('p-sim-chart');
  if (!canvas) return;
  const D=200, P=5, L=4, Tlvl=2542, IS=742;
  const days=[], invData=[], revPoints=[];
  let inv=Tlvl;
  const pending=[];
  for(let day=0;day<=35;day++){
    pending.filter(o=>o.arrival===day).forEach(o=>{inv+=o.qty;});
    for(let i=pending.length-1;i>=0;i--) if(pending[i].arrival===day) pending.splice(i,1);
    inv=Math.max(0,inv-D);
    days.push(day);
    invData.push(Math.round(inv));
    if((day+1)%P===0){
      const Q=Math.max(0,Tlvl-inv);
      if(Q>0) pending.push({arrival:day+1+L,qty:Q});
      revPoints.push(day);
    }
  }
  destroyActiveChart();
  const annotations={
    tLine:{type:'line',yMin:Tlvl,yMax:Tlvl,borderColor:'#fbbf24',borderWidth:2,borderDash:[6,4],
      label:{display:true,content:'T = '+Tlvl.toLocaleString()+' (nivel objetivo)',position:'end',color:'#fbbf24',font:{size:11,weight:'bold'},backgroundColor:'rgba(10,14,26,0.85)'}},
    isLine:{type:'line',yMin:IS,yMax:IS,borderColor:'#f87171',borderWidth:2,borderDash:[4,4],
      label:{display:true,content:'IS = '+IS.toLocaleString()+' (stock seguridad)',position:'start',color:'#f87171',font:{size:11,weight:'bold'},backgroundColor:'rgba(10,14,26,0.85)'}}
  };
  revPoints.forEach((d,i)=>{
    annotations['rev'+i]={type:'line',xMin:d,xMax:d,borderColor:'rgba(74,222,128,0.6)',borderWidth:1.5,borderDash:[3,3],
      label:{display:i===0,content:'Revisión',position:'start',color:'#4ade80',font:{size:10},backgroundColor:'rgba(10,14,26,0.8)'}};
    const del=d+L+1;
    if(del<=35) annotations['del'+i]={type:'line',xMin:del,xMax:del,borderColor:'rgba(96,165,250,0.6)',borderWidth:1.5,borderDash:[3,3],
      label:{display:i===0,content:'Llegada (L='+L+'d)',position:'end',color:'#60a5fa',font:{size:10},backgroundColor:'rgba(10,14,26,0.8)'}};
  });
  state.activeChart = new Chart(canvas,{
    type:'line',
    data:{labels:days,datasets:[{
      label:'Inventario (cajas)',data:invData,
      borderColor:'#c084fc',backgroundColor:'rgba(192,132,252,0.12)',
      borderWidth:2.5,fill:true,pointRadius:2,tension:0.15
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{
        x:{title:{display:true,text:'Día',color:'#8892b0'},ticks:{color:'#8892b0',maxTicksLimit:12},grid:{color:'rgba(255,255,255,0.04)'}},
        y:{title:{display:true,text:'Cajas',color:'#8892b0'},min:0,max:Tlvl+300,
           ticks:{color:'#8892b0',callback:v=>v.toLocaleString()},grid:{color:'rgba(255,255,255,0.04)'}}
      },
      plugins:{
        legend:{labels:{color:'#e8ecf5',font:{size:12}}},
        tooltip:{callbacks:{label:ctx=>`${ctx.parsed.y.toLocaleString()} cajas`,title:items=>`Día ${items[0].label}`}},
        annotation:{annotations}
      }
    }
  });
}
